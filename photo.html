<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>இஸ்லாமியப் புகைப்படங்கள் | Yaseenis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Mukta+Malar:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #064e3b; --primary-light: #059669; --gold: #d97706; --bg-light: #f1f5f9; --white: #ffffff; --text-dark: #0f172a; --text-gray: #475569; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Mukta Malar', sans-serif; background: var(--bg-light); color: var(--text-dark); padding: 20px; }
        
        .header { text-align: center; margin: 40px 0; }
        .header h1 { color: var(--primary); font-size: 36px; font-weight: 800; }
        .header p { color: var(--text-gray); font-size: 18px; }

        /* Photo Gallery Grid */
        .photo-grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        
        #loader { grid-column: 1 / -1; text-align: center; font-size: 18px; color: var(--primary); padding: 40px; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid rgba(6,78,59,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }

        /* Premium Photo Card */
        .photo-card { background: var(--white); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); animation: fadeIn 0.5s ease; transition: 0.3s; border: 1px solid rgba(6,78,59,0.05); }
        .photo-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(6,78,59,0.15); }
        
        .img-container { width: 100%; height: 250px; overflow: hidden; background: #e2e8f0; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; cursor: pointer; }
        .photo-card:hover .img-container img { transform: scale(1.05); }
        
        .photo-info { padding: 20px; }
        .p-title { font-size: 20px; color: var(--primary); font-weight: 800; margin-bottom: 8px; }
        .p-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-gray); font-weight: 600; }

        .back-link { display: block; text-align: center; margin-top: 40px; color: var(--primary); font-weight: bold; text-decoration: none; font-size: 18px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖼️ புகைப்படங்கள்</h1>
        <p>இஸ்லாமிய சிந்தனைகள் மற்றும் பொன்மொழிகள்</p>
    </div>

    <div class="photo-grid" id="photoContainer">
        <div id="loader"><div class="spinner"></div><br>புகைப்படங்கள் ஏற்றப்படுகின்றன...</div>
    </div>

    <a href="index.html" class="back-link">⬅️ முகப்புக்குத் திரும்பு</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyA58LsyYjrJuZDChB9TaM5FUnHE-UMFl5o", authDomain: "yaseenis-user.firebaseapp.com", projectId: "yaseenis-user", storageBucket: "yaseenis-user.firebasestorage.app", messagingSenderId: "337971140829", appId: "1:337971140829:web:c30a126aac465ded12e334" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchPhotos() {
            const container = document.getElementById("photoContainer");
            try {
                const q = query(collection(db, "photo_uploads"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                container.innerHTML = ""; 

                if (querySnapshot.empty) { container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#64748b;">புகைப்படங்கள் ஏதுமில்லை.</div>`; return; }

                querySnapshot.forEach((doc) => {
                    const data = doc.data(); 
                    const card = document.createElement("div");
                    card.className = "photo-card";
                    card.innerHTML = `
                        <div class="img-container">
                            <a href="${data.fileUrl}" target="_blank">
                                <img src="${data.fileUrl}" alt="${data.title}" loading="lazy">
                            </a>
                        </div>
                        <div class="photo-info">
                            <div class="p-title">${data.title}</div>
                            <div class="p-meta">
                                <span>👤 ${data.uploaderName}</span>
                                <span>📅 ${data.uploadDateString}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) { container.innerHTML = `<div style="grid-column: 1/-1; color:red; text-align:center;">பிழை!</div>`; }
        }
        window.onload = fetchPhotos;
    </script>
</body>
</html>
