<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF புத்தகங்கள் | Yaseenis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Mukta+Malar:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #064e3b; --primary-light: #059669; --gold: #d97706; --bg-light: #f1f5f9; --white: #ffffff; --text-dark: #0f172a; --text-gray: #475569; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Mukta Malar', sans-serif; background: var(--bg-light); color: var(--text-dark); padding: 20px; }
        
        .header { text-align: center; margin: 40px 0; }
        .header h1 { color: var(--primary); font-size: 36px; font-weight: 800; }
        
        .grid-container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        #loader { grid-column: 1 / -1; text-align: center; font-size: 18px; color: var(--primary); padding: 40px; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid rgba(6,78,59,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }

        .pdf-card { background: var(--white); padding: 25px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; animation: fadeIn 0.5s ease; transition: 0.3s; border-top: 4px solid var(--gold); }
        .pdf-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(6,78,59,0.1); }
        
        .pdf-icon { font-size: 50px; margin-bottom: 15px; }
        .p-title { font-size: 20px; color: var(--primary); font-weight: 800; margin-bottom: 10px; }
        .p-meta { font-size: 13px; color: var(--text-gray); margin-bottom: 20px; }
        
        .read-btn { display: inline-block; background: var(--primary-light); color: var(--white); padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 700; width: 100%; transition: 0.3s; }
        .read-btn:hover { background: var(--gold); }

        .back-link { display: block; text-align: center; margin-top: 40px; color: var(--primary); font-weight: bold; text-decoration: none; font-size: 18px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 PDF புத்தகங்கள்</h1>
    </div>

    <div class="grid-container" id="pdfContainer">
        <div id="loader"><div class="spinner"></div><br>புத்தகங்கள் ஏற்றப்படுகின்றன...</div>
    </div>

    <a href="index.html" class="back-link">⬅️ முகப்புக்குத் திரும்பு</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyA58LsyYjrJuZDChB9TaM5FUnHE-UMFl5o", authDomain: "yaseenis-user.firebaseapp.com", projectId: "yaseenis-user", storageBucket: "yaseenis-user.firebasestorage.app", messagingSenderId: "337971140829", appId: "1:337971140829:web:c30a126aac465ded12e334" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchPDFs() {
            const container = document.getElementById("pdfContainer");
            try {
                const q = query(collection(db, "pdf_uploads"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                container.innerHTML = ""; 

                if (querySnapshot.empty) { container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#64748b;">புத்தகங்கள் ஏதுமில்லை.</div>`; return; }

                querySnapshot.forEach((doc) => {
                    const data = doc.data(); 
                    const card = document.createElement("div");
                    card.className = "pdf-card";
                    card.innerHTML = `
                        <div class="pdf-icon">📖</div>
                        <div class="p-title">${data.title}</div>
                        <div class="p-meta">பதிவேற்றம்: ${data.uploadDateString}</div>
                        <a href="${data.fileUrl}" target="_blank" class="read-btn">புத்தகத்தைப் படிக்க ↗️</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) { container.innerHTML = `<div style="grid-column: 1/-1; color:red; text-align:center;">பிழை!</div>`; }
        }
        window.onload = fetchPDFs;
    </script>
</body>
</html>
