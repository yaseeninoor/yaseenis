<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="திருக்குர்ஆனின் 114 சூராக்களையும் அரபி மூலத்துடன் தமிழ் மொழிபெயர்ப்பில் ஆன்லைனில் வாசிக்கவும்.">
    <meta name="theme-color" content="#064e3b">
    <link rel="canonical" href="https://yaseenis.com/Quran/quran.html">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" href="/assets/yaseenis-icon.svg" type="image/svg+xml">
    <title>திருக்குர்ஆன் | Yaseenis</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Mukta+Malar:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #064e3b; --primary-dark: #022c22; --gold: #d97706; --gold-light: #fef3c7; --bg-surface: #ffffff; --text-main: #0f172a; --text-muted: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Mukta Malar', 'Inter', sans-serif; background: #f7f8f3; color: var(--text-main); line-height:1.65; }
        a { text-decoration: none; color: inherit; }
        
        /* Header */
        .topbar { background: var(--primary-dark); color: var(--gold-light); text-align: center; padding: 8px; font-family: 'Amiri', serif; font-size: 20px; }
        header { background: rgba(255, 254, 250, 0.96); padding: 14px 20px; box-shadow: 0 6px 22px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 1000; border-bottom:1px solid #e7d9b8; backdrop-filter:blur(12px); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary-dark); }
        .logo span { color: var(--gold); }
        
        /* Page Title */
        .page-header { background: radial-gradient(circle at 80% 15%,#d5b45830,transparent 25%),linear-gradient(135deg, #032b22, #075640 65%, #12382d); color: white; padding: 55px 20px 48px; text-align: center; border-bottom: 4px solid #c79a3b; margin-bottom: 28px; }
        .page-header h1 { font-size: 42px; margin-bottom: 15px; }

        /* Surah Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 80px; }
        .surah-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,280px), 1fr)); gap: 15px; }
        
        .surah-card { background: #fffefa; padding: 18px; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.035); border: 1px solid #e5e6d9; transition: 0.25s; display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap:8px; min-width:0; }
        .surah-card:hover { transform: translateY(-3px); border-color: #c79a3b; box-shadow: 0 12px 24px rgba(6,78,59,0.10); }
        
        .surah-number { background: var(--primary-light); color: white; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; font-size: 16px; background: var(--primary); }
        .surah-info { flex-grow: 1; padding: 0 15px; }
        .surah-name-en { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
        .surah-name-ta { font-size: 14px; color: var(--text-muted); }
        .surah-name-ar { font-family: 'Amiri', serif; font-size: 24px; color: var(--gold); font-weight: bold; }

        #loading { text-align: center; font-size: 20px; color: var(--text-muted); grid-column: 1 / -1; padding: 40px; }

        .quran-tools{max-width:1200px;margin:0 auto 20px;padding:0 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap} #surahSearch{flex:1;min-width:220px;border:1px solid #d9e1d7;background:#fffefa;border-radius:14px;padding:13px 16px;font:inherit;outline-offset:3px} #surahCount{color:#65776b;font-size:14px;font-weight:700} .home-link{color:#075640;font-weight:700;border:1px solid #e7d9b8;border-radius:12px;padding:9px 13px} .empty-state{grid-column:1/-1;text-align:center;padding:30px;color:#66756c;background:#fffefa;border-radius:14px} @media(max-width:600px){.page-header{padding:38px 16px 34px}.page-header h1{font-size:30px}.page-header p{font-size:14px}.container{padding:0 14px 50px}.surah-card{padding:14px}.surah-name-ar{font-size:21px}.quran-tools{padding:0 14px}.logo{font-size:20px}}
    </style>
</head>
<body>

    <div class="topbar">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
    <header>
        <div class="nav-container">
            <a href="../" class="logo">۞ Yaseenis<span>.com</span></a><a href="../" class="home-link">← முகப்பு</a>
        </div>
    </header>

    <div class="page-header">
        <h1>அல்குர்ஆன் (The Noble Quran)</h1>
        <p>114 சூராக்கள் · அரபி மூலமும் தமிழ் மொழிபெயர்ப்பும் · இலவச ஆன்லைன் வாசிப்பு</p>
    </div>

    <div class="quran-tools"><input id="surahSearch" type="search" placeholder="சூரா பெயர் அல்லது எண் தேடுங்கள்… (எ.கா. Al-Fatihah / 1)" aria-label="சூரா பெயர் அல்லது எண் தேடுங்கள்"><span id="surahCount" aria-live="polite">சூராக்கள் ஏற்றப்படுகின்றன…</span></div>
    <div class="container">
        <div class="surah-grid" id="surahGrid">
            <div id="loading">சூராக்கள் ஏற்றப்படுகின்றன (Loading...)</div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('surahGrid');
        const searchInput = document.getElementById('surahSearch');
        const countLabel = document.getElementById('surahCount');
        let allSurahs = [];
        function renderSurahs() {
            const query = searchInput.value.trim().toLocaleLowerCase();
            const filtered = allSurahs.filter(surah =>
                String(surah.number).includes(query) ||
                (surah.englishName || '').toLocaleLowerCase().includes(query) ||
                (surah.englishNameTranslation || '').toLocaleLowerCase().includes(query) ||
                (surah.name || '').toLocaleLowerCase().includes(query)
            );
            grid.replaceChildren();
            countLabel.textContent = filtered.length + ' / 114 சூராக்கள்';
            if (!filtered.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'இந்தத் தேடலுக்கு பொருந்தும் சூரா கிடைக்கவில்லை.';
                grid.appendChild(empty);
                return;
            }
            filtered.forEach(surah => {
                const card = document.createElement('a');
                card.href = 'view-surah.html?id=' + encodeURIComponent(surah.number);
                card.className = 'surah-card';
                const number = document.createElement('div');
                number.className = 'surah-number';
                number.textContent = surah.number;
                const info = document.createElement('div');
                info.className = 'surah-info';
                const en = document.createElement('div');
                en.className = 'surah-name-en';
                en.textContent = surah.englishName;
                const ta = document.createElement('div');
                ta.className = 'surah-name-ta';
                ta.textContent = surah.englishNameTranslation;
                info.append(en, ta);
                const ar = document.createElement('div');
                ar.className = 'surah-name-ar';
                ar.lang = 'ar';
                ar.dir = 'rtl';
                ar.textContent = surah.name;
                card.append(number, info, ar);
                grid.appendChild(card);
            });
        }
        async function fetchSurahs() {
            try {
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                if (!response.ok) throw new Error('API response not OK');
                const data = await response.json();
                if (data.code !== 200 || !Array.isArray(data.data)) throw new Error('Invalid Surah data');
                allSurahs = data.data;
                renderSurahs();
            } catch (error) {
                grid.replaceChildren();
                const errorBox = document.createElement('div');
                errorBox.id = 'loading';
                errorBox.textContent = 'சூரா பட்டியலை ஏற்ற முடியவில்லை. இணையத் தொடர்பைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்.';
                grid.appendChild(errorBox);
                countLabel.textContent = 'இணைப்பு தேவை';
            }
        }
        searchInput.addEventListener('input', renderSurahs);
        fetchSurahs();
    </script>
    <script>if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {})); }</script>
</body>
</html>
