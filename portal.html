<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>உள்நுழைக (Login) | Yaseenis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Mukta+Malar:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #064e3b; --primary-light: #059669; --gold: #d97706; --dark: #0f172a; --bg-light: #f1f5f9; --white: #ffffff; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Mukta Malar', sans-serif; 
            background: linear-gradient(135deg, rgba(6,78,59,0.05) 0%, rgba(217,119,6,0.05) 100%), var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        /* Top & Bottom Links */
        .home-link {
            background: var(--white);
            color: var(--primary);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(6,78,59,0.1);
        }
        .home-link:hover { background: var(--primary); color: var(--white); transform: translateY(-2px); }

        /* Premium Glass Login Card */
        .login-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-container::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, var(--gold), var(--primary));
        }

        .icon-circle {
            width: 80px; height: 80px;
            background: rgba(6,78,59,0.1);
            color: var(--primary);
            font-size: 35px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px auto;
            border: 2px dashed var(--primary-light);
        }

        h2 { color: var(--dark); font-size: 26px; margin-bottom: 5px; }
        p.subtitle { color: #64748b; font-size: 15px; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }
        input { 
            width: 100%; padding: 14px; 
            border: 2px solid #e2e8f0; border-radius: 12px; 
            font-size: 16px; outline: none; transition: 0.3s; 
            background: var(--white);
        }
        input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1); }

        .btn {
            background: var(--primary);
            color: var(--white);
            border: none; padding: 15px; width: 100%;
            border-radius: 12px; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: var(--gold); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.2); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        /* Welcome Wish Modal */
        #wishMessage {
            display: none;
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 600;
            font-size: 16px;
            animation: fadeIn 0.5s ease;
            border: 1px solid #bbf7d0;
        }
        
        #errorMsg { color: #dc2626; margin-top: 15px; font-weight: 600; display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Top Link -->
    <a href="index.html" class="home-link">🏠 முகப்புப் பக்கம் (Home)</a>

    <!-- Login Card -->
    <div class="login-container">
        <div class="icon-circle">🔐</div>
        <h2>Yaseenis Admin</h2>
        <p class="subtitle">பதிவேற்றம் செய்ய முதலில் உள்நுழையவும்</p>

        <form id="loginForm">
            <div class="form-group">
                <label>மின்னஞ்சல் (Email)</label>
                <input type="email" id="email" placeholder="உங்கள் மின்னஞ்சல்" required>
            </div>
            <div class="form-group">
                <label>கடவுச்சொல் (Password)</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" id="loginBtn" class="btn">உள்நுழைக (Login)</button>
        </form>

        <div id="wishMessage"></div>
        <div id="errorMsg"></div>
    </div>

    <!-- Bottom Link -->
    <a href="index.html" class="home-link">⬅️ இணையதளத்திற்குத் திரும்பு</a>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA58LsyYjrJuZDChB9TaM5FUnHE-UMFl5o",
            authDomain: "yaseenis-user.firebaseapp.com",
            projectId: "yaseenis-user",
            storageBucket: "yaseenis-user.firebasestorage.app",
            messagingSenderId: "337971140829",
            appId: "1:337971140829:web:c30a126aac465ded12e334"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Check if already logged in -> Redirect immediately
        onAuthStateChanged(auth, (user) => {
            if (user) { window.location.replace("upload.html"); }
        });

        // Login Submit Event
        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const loginBtn = document.getElementById("loginBtn");
            const wishMsg = document.getElementById("wishMessage");
            const errorMsg = document.getElementById("errorMsg");

            loginBtn.innerText = "சரிபார்க்கப்படுகிறது... ⏳";
            loginBtn.disabled = true;
            errorMsg.style.display = "none";

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // WELCOME WISH
                    wishMsg.innerHTML = `✨ அஸ்ஸலாமு அலைக்கும்!<br>நல்வரவு <b>${user.email.split('@')[0]}</b>.<br>சிறிது காத்திருக்கவும்...`;
                    wishMsg.style.display = "block";
                    document.getElementById("loginForm").style.display = "none"; // Hide form on success

                    // Wait 2 seconds so user can read the wish, then redirect
                    setTimeout(() => {
                        window.location.replace("upload.html");
                    }, 2500);
                })
                .catch((error) => {
                    errorMsg.innerText = "பிழை: தவறான மின்னஞ்சல் அல்லது கடவுச்சொல்.";
                    errorMsg.style.display = "block";
                    loginBtn.innerText = "உள்நுழைக (Login)";
                    loginBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
