<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ஹதீஸ் பதிவேற்றம் | Yaseenis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Mukta+Malar:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #064e3b; --primary-light: #047857; --gold: #d97706; --bg-light: #f8fafc; --white: #ffffff; }
        body { font-family: 'Mukta Malar', sans-serif; background: var(--bg-light); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 40px auto; background: var(--white); padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid var(--primary); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 30px; font-size: 28px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #334155; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 16px; box-sizing: border-box; }
        textarea.arabic-input { font-family: 'Amiri', serif; font-size: 22px; text-align: right; direction: rtl; }
        textarea { resize: vertical; min-height: 120px; }
        
        .submit-btn { background: var(--primary-light); color: var(--white); padding: 14px 25px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: var(--gold); }
        .back-link { display: block; text-align: center; margin-top: 25px; color: var(--primary-light); font-weight: bold; text-decoration: none; }
        
        #statusMsg { text-align: center; margin-top: 20px; font-weight: bold; font-size: 18px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>புதிய ஹதீஸ் பதிவேற்றம் 🕌</h2>
        <form id="hadithForm">
            <div class="form-group">
                <label>ஹதீஸ் நூல் (Book)</label>
                <select id="bookName" required>
                    <option value="ஸஹீஹுல் புகாரி">ஸஹீஹுல் புகாரி (Sahih al-Bukhari)</option>
                    <option value="ஸஹீஹ் முஸ்லிம்">ஸஹீஹ் முஸ்லிம் (Sahih Muslim)</option>
                    <option value="சுனன் அபூதாவூத்">சுனன் அபூதாவூத் (Sunan Abu Dawud)</option>
                    <option value="சுனன் அன்-நஸாயி">சுனன் அன்-நஸாயி (Sunan an-Nasa'i)</option>
                    <option value="சுனன் இப்னு மாஜா">சுனன் இப்னு மாஜா (Sunan Ibn Majah)</option>
                    <option value="ஜாமி அத்-திர்மிதி">ஜாமி அத்-திர்மிதி (Jami at-Tirmidhi)</option>
                </select>
            </div>

            <div style="display: flex; gap: 20px;">
                <div class="form-group" style="flex: 1;">
                    <label>பாடம் / தலைப்பு (Chapter)</label>
                    <input type="text" id="chapter" placeholder="உம்: ஈமான் (இறைநம்பிக்கை)" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>ஹதீஸ் எண் (Hadith No)</label>
                    <input type="number" id="hadithNumber" placeholder="உம்: 1" required>
                </div>
            </div>

            <div class="form-group">
                <label>அரபி மூலம் (Arabic Text)</label>
                <textarea id="arabicText" class="arabic-input" placeholder="نص الحديث بالعربية..." required></textarea>
            </div>

            <div class="form-group">
                <label>தமிழாக்கம் (Tamil Translation)</label>
                <textarea id="tamilText" placeholder="ஹதீஸின் தமிழாக்கத்தை இங்கே தட்டச்சு செய்யவும்..." required></textarea>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">ஹதீஸைப் பதிவேற்று</button>
            <div id="statusMsg"></div>
        </form>
        <a href="index.html" class="back-link">← முகப்புக்குத் திரும்பு</a>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA58LsyYjrJuZDChB9TaM5FUnHE-UMFl5o",
            authDomain: "yaseenis-user.firebaseapp.com",
            projectId: "yaseenis-user",
            storageBucket: "yaseenis-user.firebasestorage.app",
            messagingSenderId: "337971140829",
            appId: "1:337971140829:web:c30a126aac465ded12e334"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security: Only logged-in users can see this page
        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.replace("portal.html"); }
        });

        // Form Submission
        document.getElementById("hadithForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            const statusMsg = document.getElementById("statusMsg");
            
            submitBtn.innerText = "பதிவேற்றப்படுகிறது...";
            submitBtn.disabled = true;

            try {
                await addDoc(collection(db, "hadiths"), {
                    bookName: document.getElementById("bookName").value,
                    chapter: document.getElementById("chapter").value,
                    hadithNumber: parseInt(document.getElementById("hadithNumber").value),
                    arabicText: document.getElementById("arabicText").value,
                    tamilText: document.getElementById("tamilText").value,
                    createdAt: serverTimestamp(),
                    userEmail: auth.currentUser.email
                });

                statusMsg.style.display = "block";
                statusMsg.style.color = "green";
                statusMsg.innerText = "ஹதீஸ் வெற்றிகரமாகப் பதிவேற்றப்பட்டது! ✅";
                document.getElementById("hadithForm").reset();

            } catch (error) {
                statusMsg.style.display = "block";
                statusMsg.style.color = "red";
                statusMsg.innerText = "பிழை: " + error.message;
            } finally {
                submitBtn.innerText = "ஹதீஸைப் பதிவேற்று";
                submitBtn.disabled = false;
                setTimeout(() => { statusMsg.style.display = "none"; }, 5000);
            }
        });
    </script>
</body>
</html>
