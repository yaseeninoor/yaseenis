name: Sync source articles

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-source-articles.py"
      - ".github/workflows/sync-source-articles.yml"

permissions:
  contents: write

concurrency:
  group: sync-source-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch new public source posts
        run: python scripts/sync-source-articles.py
      - name: Commit updated source feed
        run: |
          if git diff --quiet -- article/source-feed.json; then
            echo "No source feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article/source-feed.json
          git commit -m "chore: sync latest source articles"
          git push
