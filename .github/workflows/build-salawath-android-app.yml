name: Build Salawath Native Android App
on:
  workflow_dispatch:
  push:
    paths:
      - 'salawath-app/**'
      - '.github/workflows/build-salawath-android-app.yml'
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses
      - name: Install Capacitor generator
        working-directory: salawath-app
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: salawath-app
        run: npx cap add android
      - name: Replace web wrapper with native Java screen
        run: |
          mkdir -p salawath-app/android/app/src/main/java/com/yaseenis/salawath
          cp salawath-app/native-android/MainActivity.java salawath-app/android/app/src/main/java/com/yaseenis/salawath/MainActivity.java
          python - <<'PY'
          from pathlib import Path
          p=Path('salawath-app/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<uses-permission android:name="android.permission.INTERNET" />','')
          p.write_text(s)
          PY
      - name: Build native debug APK
        working-directory: salawath-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: salawath-native-android-apk
          path: salawath-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
