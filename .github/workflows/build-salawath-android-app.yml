name: Build Salawath Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'salawath-app/**'
      - '.github/workflows/build-salawath-android-app.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          yes | sdkmanager --licenses

      - name: Install app dependencies
        working-directory: salawath-app
        run: npm ci

      - name: Generate Android project
        working-directory: salawath-app
        run: npx cap add android

      - name: Build debug APK
        working-directory: salawath-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salawath-android-apk
          path: salawath-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
