<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071c17"><title>Yaseeni Live · First Admin Setup</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071c17;color:#fff7df;font:16px system-ui;padding:22px;display:grid;place-items:center}.card{width:min(100%,460px);background:#10352a;border:1px solid #315b4b;border-radius:22px;padding:24px}h1{margin:0 0 8px;color:#e8c875}p{color:#b4c8bb;line-height:1.6;font-size:14px}label{display:block;margin:15px 0 6px;color:#e8c875;font-size:13px;font-weight:700}input{width:100%;padding:14px;border-radius:12px;border:1px solid #315b4b;background:#071d17;color:#fff7df;font:inherit}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:12px;background:#e8c875;color:#17251d;font-weight:800;font-size:15px}#msg{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:15px}.warn{border:1px solid #8e7037;border-radius:12px;padding:12px;color:#ffe4a0;font-size:12px;margin-top:15px}
</style></head><body><main class="card"><h1>Yaseeni Live</h1><p>First administrator account setup. This page sends your ADMIN_KEY directly to your Yaseeni Live Worker over HTTPS. It does not save the key in this website.</p><form id="f"><label>Admin full name</label><input id="name" required maxlength="80" autocomplete="name"><label>Admin email</label><input id="email" type="email" required autocomplete="email"><label>Admin password (minimum 10 characters)</label><input id="password" type="password" minlength="10" required autocomplete="new-password"><label>ADMIN_KEY (Cloudflare Secret value)</label><input id="key" type="password" required autocomplete="off"><button id="submit">Create first admin account</button></form><div class="warn">Use this only once. The Worker rejects setup after an admin already exists. Never share your ADMIN_KEY or password.</div><p id="msg" role="status"></p></main><script>
const API="https://yaseeni-live-api.yaseeninoor.workers.dev";
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("submit"),msg=document.getElementById("msg");btn.disabled=true;msg.textContent="Creating admin account…";try{const r=await fetch(API+"/api/admin/bootstrap",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim(),password:document.getElementById("password").value,adminKey:document.getElementById("key").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Setup failed");msg.textContent="Admin account created successfully. You can now use the Yaseeni Live login page.";document.getElementById("f").reset()}catch(err){msg.textContent="Error: "+err.message}finally{btn.disabled=false}});
</script></body></html>
